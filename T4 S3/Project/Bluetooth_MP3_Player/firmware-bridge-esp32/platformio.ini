; ESP32 A2DP bridge dongle - companion to the T4-S3 Bluetooth MP3 Player.
;
; The T4-S3's ESP32-S3 chip has Bluetooth LE only and physically cannot talk
; to Bluetooth headphones (A2DP = Bluetooth Classic). This sketch runs on any
; classic-ESP32 dev board (ESP32-DevKitC / WROOM-32) and acts as the Bluetooth
; radio: it scans, pairs and streams the PCM received over UART to any
; Bluetooth headphone or speaker via A2DP/SBC.
;
; Wiring (T4-S3 30-pin header -> this board):
;   T4-S3 GPIO21 (TX)  ->  GPIO16 (RX2)
;   T4-S3 GPIO47 (RX)  <-  GPIO17 (TX2)
;   T4-S3 GND          ->  GND
;   T4-S3 VDD3V3       ->  3V3 pin   (see README "Powering the bridge")

[platformio]
default_envs = bridge

[env:bridge]
platform = espressif32@6.12.0
framework = arduino
board = esp32dev
monitor_speed = 115200
build_flags =
    -DCORE_DEBUG_LEVEL=0
    -DBRIDGE_RX_PIN=16
    -DBRIDGE_TX_PIN=17
lib_deps =
    https://github.com/pschatzmann/ESP32-A2DP.git
