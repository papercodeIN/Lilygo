; LilyGo T4-S3 Bluetooth MP3 Player - main firmware
; Display: RM690B0 2.41" QSPI AMOLED 450x600, touch CST226SE, PMU SY6970
;
; The LilyGo display library is vendored in lib/ (pruned of examples so the
; Windows 260-character path limit cannot break installation). lv_conf.h is
; pinned in include/ (copy of the library's config: Montserrat 12-48 fonts,
; PSRAM allocator, LV_COLOR_16_SWAP=1).

[platformio]
default_envs = t4s3
boards_dir = boards

[env:t4s3]
platform = espressif32@6.12.0
framework = arduino
board = T-Display-AMOLED
upload_speed = 921600
monitor_speed = 115200
monitor_rts = 0
monitor_dtr = 0
build_flags =
    -DBOARD_HAS_PSRAM
    -DDISABLE_ALL_LIBRARY_WARNINGS
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DCORE_DEBUG_LEVEL=1
extra_scripts = pre:scripts/copy_lvconf.py
lib_deps =
    lvgl/lvgl@8.4.0
    https://github.com/pschatzmann/arduino-libhelix.git
