[env:lilygo_t_hmi]
platform = espressif32@6.9.0
board = esp32-s3-devkitc-1
framework = arduino
board_build.flash_mode = qio
board_build.psram_type = opi
board_build.memory_type = qio_opi
board_build.arduino.memory_type = qio_opi
board_upload.flash_size = 16MB
board_upload.maximum_size = 6553600
board_build.partitions = default_16MB.csv
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
lib_deps =
    lvgl/lvgl@8.3.11
    T-vK/ESP32 BLE Keyboard@^0.3.2
    ; Same spec the `unity` test runner injects (test/runners/unity.py). Pinning
    ; it here keeps Unity installed between the firmware and test builds;
    ; otherwise each test run removes/reinstalls it, which breaks the SCons
    ; dependency scan mid-build. Dead code in the firmware; the linker
    ; discards it.
    throwtheswitch/Unity@^2.6.1
build_unflags =
    -std=gnu++11
    -DARDUINO_USB_MODE=1
; USB stays in TinyUSB CDC mode (same as the USB Stream Deck project) so the
; serial monitor and the upload workflow are identical; the deck output itself
; goes over Bluetooth LE HID, not USB.
build_flags =
    -D BOARD_HAS_PSRAM
    -D ARDUINO_USB_MODE=0
    -D ARDUINO_USB_CDC_ON_BOOT=1
    ; 2 = warnings + errors from the Arduino core (debug aid; 1 is quieter)
    -D CORE_DEBUG_LEVEL=2
    -D TOUCH_DEBUG=0
    -I include
    -D LV_CONF_INCLUDE_SIMPLE
    -std=gnu++17
build_src_flags =
    -Wall
    -Wextra
    -Wshadow
